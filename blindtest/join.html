<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a2540">
  <title>Blind Test, Rejoindre une partie</title>
  <link rel="stylesheet" href="../shared/css/landing.css?v=10">
  <link rel="stylesheet" href="css/nav.css?v=3">
  <script>
    // Applique le theme avant le premier rendu pour eviter le flash clair.
    (function(){try{var t=localStorage.getItem('pdt-theme');if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
  </script>
  <link rel="stylesheet" href="../shared/css/theme.css?v=4">
</head>
<body>
  <header class="landing-header ct-header">
    <a href="index.html" class="app-header-home" title="Retour au choix du mode">← Modes Blind Test</a>
    <h1>Blind Test</h1>
    <span class="header-tagline" id="server-status">connexion au serveur…</span>
  </header>

  <main class="entry-main">
    <div class="entry-card">
      <h2 id="card-title">Rejoindre une partie</h2>
      <p class="entry-sub" id="subtitle">
        Le lien d'invitation est invalide ou manquant. Demande un nouveau lien à l'hôte.
      </p>

      <div class="entry-resume" id="resume-banner" hidden>
        <p>Tu étais dans une partie (code <span id="resume-code"></span>, pseudo <span id="resume-pseudo"></span>).</p>
        <div class="entry-resume-actions">
          <button class="btn btn-primary" id="resumeBtn">Reprendre</button>
          <button class="btn btn-ghost" id="forgetBtn">Ignorer</button>
        </div>
      </div>

      <div class="entry-alert" id="error-box"></div>

      <div class="entry-field" id="pseudo-group">
        <label for="pseudo-input">Ton pseudo</label>
        <input type="text" id="pseudo-input" placeholder="Ex : Max" maxlength="20" autocomplete="off">
      </div>

      <button class="btn btn-primary" id="btn-action">Rejoindre la partie</button>
    </div>
  </main>

  <footer class="app-footer">
    <a href="regles.html">Règles du jeu</a>
    <span class="footer-sep">·</span>
    <a href="../mentions.html">Mentions légales</a>
    <span class="footer-sep">·</span>
    <a href="https://www.twitch.tv/prof_de_tweener" target="_blank" rel="noopener">🟣 Twitch</a>
    <span class="footer-sep">·</span>
    <a href="https://buymeacoffee.com/profdetweener" target="_blank" rel="noopener">☕ Soutenir</a>
  </footer>

  <script type="module" src="js/join.js?v=1"></script>
  <script type="module" src="../shared/js/theme.js?v=2"></script>
</body>
</html>
