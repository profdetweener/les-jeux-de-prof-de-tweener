# Worker dedie aux "Jeux du Prof de Tweener".
name = "tweener-jeux"
account_id = "5c658ef5dd4d01245f96062fe178d599"
main = "src/index.ts"
compatibility_date = "2025-05-01"

# ===========================================
# Durable Objects
# ===========================================
# PetitBacRoom : une instance par room de Petit Bac.
# MotusRoom    : une instance par room de Motus.
# Namespaces separes -> pas de collision de codes entre jeux.

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "PetitBacRoom"

[[durable_objects.bindings]]
name = "MOTUS_ROOMS"
class_name = "MotusRoom"

[[durable_objects.bindings]]
name = "DEFINITION_ROOMS"
class_name = "DefinitionRoom"

# Singleton d'agregation des votes de difficulte (jeu Definitions).
# Une seule instance, adressee par idFromName("global").
[[durable_objects.bindings]]
name = "DEFINITION_VOTES"
class_name = "DefinitionVotes"

[[durable_objects.bindings]]
name = "SLIDE_ROOMS"
class_name = "SlideRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PetitBacRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["MotusRoom"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["DefinitionRoom"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["DefinitionVotes"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["SlideRoom"]

[[durable_objects.bindings]]
name = "MOTSMELES_ROOMS"
class_name = "MotsMelesRoom"

[[migrations]]
tag = "v6"
new_sqlite_classes = ["MotsMelesRoom"]

# Pression (jeu joue depuis le tchat Twitch).
[[durable_objects.bindings]]
name = "PRESSION_ROOMS"
class_name = "PressionRoom"

# v7 a ete deploye quand le jeu s'appelait encore Cocotte-minute : la classe
# a ete creee sous le nom CocotteRoom. On garde v7 tel quel (deja applique) et
# v8 la renomme en PressionRoom.
[[migrations]]
tag = "v7"
new_sqlite_classes = ["CocotteRoom"]

[[migrations]]
tag = "v8"
renamed_classes = [{ from = "CocotteRoom", to = "PressionRoom" }]

# Blind Test en navigateur (le mode tchat Twitch, lui, n'a pas de serveur).
[[durable_objects.bindings]]
name = "BLINDTEST_ROOMS"
class_name = "BlindtestRoom"

[[migrations]]
tag = "v9"
new_sqlite_classes = ["BlindtestRoom"]
